services:
  - type: web
    name: codequery-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt &&
      python -c "
      from fastembed import TextEmbedding;
      cache = '/opt/render/project/src/.fastembed_cache';
      print('Downloading all-MiniLM-L6-v2 ONNX model (fallback embeddings)...');
      TextEmbedding(
          model_name='sentence-transformers/all-MiniLM-L6-v2',
          cache_dir=cache,
          threads=1,
      );
      print(f'FastEmbed model cached at {cache}.')
      "
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    envVars:
      # Cache fastembed ONNX models between build and runtime.
      # (FastEmbed is now only the FALLBACK embedder — Gemini is primary,
      # but keep the model warm so a missing/rate-limited key degrades
      # gracefully instead of failing.)
      - key: FASTEMBED_CACHE_DIR
        value: /opt/render/project/src/.fastembed_cache

      # LLM provider — use Groq on Render (Ollama can't run here)
      - key: CQ_LLM_PROVIDER
        value: groq
      - key: CQ_GROQ_MODEL
        value: openai/gpt-oss-20b  # free tier (llama-3.3-70b-versatile retired Aug 2026)
      - key: CQ_RETRIEVAL_TOP_K
        value: "4"   # regular questions — stays under free tier's 8K TPM
      - key: CQ_SLASH_TOP_K
        value: "8"   # slash commands get a wider window
      - key: CQ_MAX_CHUNK_CHARS
        value: "1500"  # 8 chunks x 1500 chars ~3K tokens max per prompt
      - key: GROQ_API_KEY
        sync: false  # Set this manually in the Render dashboard — never commit API keys

      # Embeddings — Gemini free API: 0 local RAM, ~100 texts per network call.
      # This is what makes indexing fast on the Render free tier.
      # Get a free key at aistudio.google.com (no card required).
      - key: CQ_EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # Set this manually in the Render dashboard — never commit API keys
      - key: CQ_GEMINI_EMBED_MODEL
        value: text-embedding-004

      # Index flush batch — with Gemini, one flush = one batched network call
      - key: CQ_EMBEDDING_BATCH_SIZE
        value: "64"
      # Parallel tree-sitter parsing during indexing (RAM-safe: one file's
      # text in flight per worker — no embedding models in these threads)
      - key: CQ_PARSE_WORKERS
        value: "4"
      - key: CQ_RERANK_ENABLED
        value: "false"

      # Prevent BLAS/ONNX dependencies from creating large thread pools.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"

      # Reject very large repositories before the clone and index exhaust RAM.
      - key: CQ_MAX_REPO_SIZE_MB
        value: "150"

      # Only the production Vercel frontend may call the public API from a browser.
      - key: ALLOWED_ORIGINS
        value: https://codequery-eight.vercel.app

      # Data directory — /tmp/data is writable on Render free tier.
      # Data is lost on restart (ephemeral), but that's acceptable here.
      - key: CQ_DATA_DIR
        value: /tmp/data

      # Disable in-memory embedding cache to save RAM on 512MB free tier
      - key: CQ_EMBED_CACHE_ENABLED
        value: "false"
      - key: CQ_AUTO_CLEANUP_ON_RESET
        value: "true"
